[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lockdrift"
version = "0.1.0"
description = "Audit dependency manifests and lockfiles for missing, extra, mismatched, and stale resolved versions across npm and Python projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lockdrift contributors" }]
keywords = ["dependencies", "lockfile", "audit", "npm", "python", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "packaging>=23.0",
    "PyYAML>=6.0",
]

[project.scripts]
lockdrift = "main:main"

[project.urls]
Homepage = "https://github.com/lockdrift/lockdrift"
Repository = "https://github.com/lockdrift/lockdrift"
Issues = "https://github.com/lockdrift/lockdrift/issues"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
